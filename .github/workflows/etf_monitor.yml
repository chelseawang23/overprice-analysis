name: "ETF Monitor"

on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'test'
        type: choice
        options: [test, intraday, daily]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Analyze
        env:
          SEATALK_APP_ID: ${{ secrets.SEATALK_APP_ID }}
          SEATALK_APP_SECRET: ${{ secrets.SEATALK_APP_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEATALK_USER_EMAILS: ${{ vars.SEATALK_USER_EMAILS || 'huixia.huang@shopee.com,jiayu.lin@shopee.com' }}
          COST_MODEL: ${{ vars.COST_MODEL || 'realistic' }}
          TRADE_CAPITAL: ${{ vars.TRADE_CAPITAL || '20000' }}
        run: |
          H=$(date -u +%H | sed 's/^0//')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$H" -lt 10 ]; then
            MODE="intraday"
          else
            MODE="daily"
          fi
          echo "Mode: $MODE (UTC $H:$(date -u +%M))"
          python etf_monitor.py --$MODE
      - name: Commit data
        if: always()
        run: |
          git config user.name "ETF Bot"
          git config user.email "bot@etf.local"
          git add historical_trades.json pending_trade.json run.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto update [skip ci]"
            git push origin main
          fi
