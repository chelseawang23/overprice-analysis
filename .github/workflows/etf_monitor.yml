name: "ETF Monitor"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'test'
        type: choice
        options: [test, intraday, daily]
  schedule:
    # 北京时间 14:30 = UTC 06:30，仅工作日（周一至周五）触发
    - cron: '30 6 * * 1-5'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Analyze
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COST_MODEL: ${{ vars.COST_MODEL || 'realistic' }}
          TRADE_CAPITAL: ${{ vars.TRADE_CAPITAL || '750' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MODE="intraday"
          fi
          echo "Mode: $MODE (UTC $(date -u +%H:%M))"
          python etf_monitor.py --$MODE
      - name: Commit data
        if: always()
        run: |
          git config user.name "ETF Bot"
          git config user.email "bot@etf.local"
          git add historical_trades.json pending_trade.json run.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto update [skip ci]"
            git push origin main
          fi
